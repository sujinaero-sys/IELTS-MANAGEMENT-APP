<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password — BUYE-Online</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="card">
      <h1>Reset your password</h1>
      <p class="sub" id="stepSub">Enter your email to receive a reset code</p>

      <form id="step1Form">
        <label>Email</label>
        <input type="email" id="email" required />
        <button class="btn orange" type="submit">Send Reset Code</button>
      </form>

      <form id="step2Form" style="display:none;">
        <label>Reset Code (check your email)</label>
        <input type="text" id="otp" required maxlength="6" />
        <label>New Password</label>
        <input type="password" id="newPassword" required minlength="6" />
        <button class="btn green" type="submit">Reset Password</button>
      </form>

      <div class="foot-links">
        <a href="index.html">Back to login</a> &nbsp;•&nbsp;
        <a href="#" id="waLink">Need help? WhatsApp us</a>
      </div>
    </div>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
  <script>
    document.getElementById('waLink').href = 'https://wa.me/' + WHATSAPP_NUMBER;
    let savedEmail = '';

    document.getElementById('step1Form').addEventListener('submit', async function (e) {
      e.preventDefault();
      savedEmail = document.getElementById('email').value.trim();
      try {
        const data = await api('forgotPassword', { email: savedEmail });
        toast(data.message, 'success');
        document.getElementById('step1Form').style.display = 'none';
        document.getElementById('step2Form').style.display = 'block';
        document.getElementById('stepSub').textContent = 'Enter the code sent to ' + savedEmail;
      } catch (err) {
        toast(err.message, 'error');
      }
    });

    document.getElementById('step2Form').addEventListener('submit', async function (e) {
      e.preventDefault();
      try {
        const data = await api('resetPassword', {
          email: savedEmail,
          otp: document.getElementById('otp').value.trim(),
          newPassword: document.getElementById('newPassword').value
        });
        toast(data.message, 'success');
        setTimeout(function () { window.location.href = 'index.html'; }, 1200);
      } catch (err) {
        toast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
